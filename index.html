<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPL Teams & Champions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>  IPL Teams & Champions</h1>
    <p>Click a team to see its trophies and championship years.</p>
  </header>

  <main>
    <section class="buttons" id="teamButtons"></section>

    <section class="team-card" id="teamCard">
      <div class="logo-watermark" id="logoWatermark">CSK</div>

      <div class="content">
        <div class="team-logo" id="teamLogo">CSK</div>
        <h2 id="teamName">Chennai Super Kings</h2>
        <p class="nickname" id="teamNickname">Yellow Army</p>

        <div class="trophy-box">
          <span>🏆</span>
          <strong id="titles">5</strong>
          <small>IPL Titles</small>
        </div>

        <h3>Championship Years</h3>
        <div class="years" id="years"></div>
        <p id="note" class="note"></p>
      </div>
    </section>
  </main>

  <footer>
    <p>IPL Teams & Champions</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
